<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zakii360 On GitHub</title>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>    
        * { margin:0; padding:0; box-sizing:border-box; transition:all 0.3s ease; }
        body {
            font-family: Arial, sans-serif;
            background:#f9f9f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            padding:20px;
        }
        .container {
            background:#fff;
            max-width:800px;
            padding:40px;
            border-radius:12px;
            box-shadow:0 10px 20px rgba(0,0,0,0.1);
            text-align:center;
        }
        .github-signin {
            padding:12px 25px;
            border-radius:8px;
            background:#24292f;
            color:white;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .github-signin img { width:18px; margin-right:10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Hi there 👋</h1>
    <h2>Welcome to my profile site!</h2>

    <button id="github-signin" class="github-signin">
        <img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg">
        Sign In with GitHub
    </button>

    <div id="user-info" style="display:none;">
        <h3>Welcome, <span id="user-name"></span></h3>
        <p>Email: <span id="user-email"></span></p>
        <button onclick="signOut()">Sign Out</button>
    </div>
</div>

<script>
    const supabaseUrl = 'https://jcteldmrdykjlikoyvfj.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjdGVsZG1yZHlramxpa295dmZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4MjUxNTUsImV4cCI6MjA5MzQwMTE1NX0.Zg5iofmJB9DadPKTO2MeXzpI2u25jx5_XPgmZVaJ8Us';


    const client = window.supabase.createClient(supabaseUrl, supabaseKey);

    const btn = document.getElementById('github-signin');

    btn.addEventListener('click', async () => {
        await client.auth.signInWithOAuth({
            provider: 'github',
            options: {
                redirectTo: window.location.origin
            }
        });
    });

  
    window.addEventListener('load', async () => {
        const { data: { user } } = await client.auth.getUser();
        if (user) showUser(user);
    });

    function showUser(user) {
        document.getElementById('user-info').style.display = 'block';
        document.getElementById('user-name').textContent =
            user.user_metadata?.full_name || 'No name';
        document.getElementById('user-email').textContent =
            user.email || 'No email';
    }

    async function signOut() {
        await client.auth.signOut();
        location.reload();
    }
</script>

</body>
</html>
